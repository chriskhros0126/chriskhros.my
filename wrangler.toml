name = "chriskhros-my"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
R2_BUCKET_NAME = "chriskhros-binaries"
# Public URL for downloads (can be your R2 public bucket URL or custom domain like https://dl.chriskhros.my)
R2_PUBLIC_URL = "https://dl.chriskhros.my"

# R2 Bucket binding for Cloudflare Pages Functions (direct low-latency reads within CF edge)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "chriskhros-binaries"

# Secrets required in Cloudflare Pages (set via dashboard or wrangler pages secret put):
# - ADMIN_SECRET_KEY: Secret token used to protect /admin upload & S3 signing endpoints
# - R2_ACCOUNT_ID: Cloudflare Account ID (find in CF Dashboard -> R2)
# - R2_ACCESS_KEY_ID: S3 API Token Access Key ID for R2
# - R2_SECRET_ACCESS_KEY: S3 API Token Secret Access Key for R2
