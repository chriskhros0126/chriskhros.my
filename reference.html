 <!DOCTYPE html><html lang="en"><head>

  <style>
    .animate-on-scroll-hidden { opacity: 0; transform: translateY(20px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
    .animate-on-scroll-visible { opacity: 1; transform: translateY(0); }
    
    @keyframes blob-float {
      0% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
      33% { transform: translate(100px, -150px) rotate(120deg) scale(1.2); }
      66% { transform: translate(-100px, 100px) rotate(240deg) scale(0.8); }
      100% { transform: translate(0px, 0px) rotate(360deg) scale(1); }
    }
    .animate-blob {
      animation: blob-float 20s linear infinite;
    }
    .animation-delay-2000 { animation-delay: 2s; }
    .animation-delay-4000 { animation-delay: 4s; }
  </style>
<style type="text/tailwindcss">@tailwind base;
@tailwind components;
@tailwind utilities;

@layer base {

  }
}

.video-text-mask {
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;

<style>
  /* Fallback for the SVG text mask sizing on some engines */
  svg text {
    user-select: none;
  }
</style></main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('animate-on-scroll-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('[data-animation-on-scroll]').forEach(el => {
        el.classList.add('animate-on-scroll-hidden');
        observer.observe(el);
      });
    });
  </script>

</body></html>
